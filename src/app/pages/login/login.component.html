
<div style="display: flex;
    align-items: center;
    justify-content: center;
    min-height: 90vh;">
    <mat-card class="w-25 mx-auto" style="box-shadow: 1px 1px 2px #000;">
        <mat-card-header>
            <mat-card-title class="text-center">
                <h3>Log In</h3>
            </mat-card-title>
            <mat-card-subtitle>
                <div>
                    <form [formGroup]="formGroup">
                        <mat-form-field class="w-100">
                            <mat-label>Username</mat-label>
                            <input matInput type="text" id="username" [formControlName]="'username'"
                                placeholder="Enter your username">
                        </mat-form-field>

                        <mat-form-field class="w-100">
                            <mat-label>Password</mat-label>
                            <input id="password" matInput type="password" [formControlName]="'password'" #passwordField>
                            <button mat-icon-button type="button" (click)="togglePassword($event, passwordField)"
                                matSuffix>
                                <mat-icon>{{passwordField.type === 'password' ? 'visibility_off' :
                                    'visibility'}}</mat-icon>
                            </button>
                        </mat-form-field>
                        <div class="text-center">
                            <button mat-raised-button color="primary" type="submit" (click)="login()">Log In</button>
                        </div>
                    </form>
                    <div class="text-center mt-3">
                        <div class="mt-2">Don't have an account? </div>
                        <button matButton (click)="openCreateAccountModal()">Create one</button>
                    </div>
                </div>
            </mat-card-subtitle>
        </mat-card-header>
        <mat-card-content>

        </mat-card-content>
    </mat-card>
</div>
