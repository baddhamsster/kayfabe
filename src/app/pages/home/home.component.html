<div class="full-screen-table-container">
    <mat-form-field>
        <mat-label>Filter</mat-label>
        <input matInput (keyup)="applyFilter($event)" placeholder="Ex. Mia" #input>
    </mat-form-field>

    <div style="position: relative;">
        <div style="position: absolute;
        height: 40px; width: 40px;
    right: 0;
    top: 10px;
        z-index: 999999;">
            <button mat-icon-button [matMenuTriggerFor]="columnSelectorMenu">
                <mat-icon>more_vert</mat-icon>
            </button>
        </div>
        <table mat-table [dataSource]="dataSource" matSort class="mat-elevation-z8">

            <ng-container *ngFor="let column of tableColumns">
                <ng-container [matColumnDef]="column.key">
                    <th mat-header-cell *matHeaderCellDef mat-sort-header> {{column.label}} </th>
                    <td mat-cell *matCellDef="let element"> {{element[column.key]}} </td>
                </ng-container>
            </ng-container>

            <tr mat-header-row *matHeaderRowDef="displayedColumns"></tr>
            <tr mat-row *matRowDef="let row; columns: displayedColumns;"></tr>

            <!-- Row shown when there is no matching data. -->
            <tr class="mat-row" *matNoDataRow>
                <td class="mat-cell" colspan="4">No data matching the filter "{{input.value}}"</td>
            </tr>
        </table>

        <mat-paginator [pageSizeOptions]="[5, 10, 25, 100]" aria-label="Select page of users"></mat-paginator>
    </div>
</div>

<mat-menu #columnSelectorMenu="matMenu" class="d-block">
    <div class="w-100" *ngFor="let column of tableColumns" (click)="$event.stopPropagation()">
        <mat-checkbox [(ngModel)]="column.show" (change)="addColumn(column.key, column.show)">
            {{ column.label }}
        </mat-checkbox>
    </div>

</mat-menu>
