<section style="width: 100vw;
  height: 100vh;">
  <nav class="navbar navbar-expand-lg px-1"
    style="background-color: #3f51b5; color: white; border-bottom: 2px solid #000;">
    <h2 class="mx-3">Kayfabe</h2>
    <span class="px-3">The Independent Pro Wrestler Database</span>
  </nav>
  <div class="container-fluid">
    <div class="row">

      @if (loginService.isLoggedIn$ | async){
      <mat-drawer-container class="example-container mat-typography" style="height: 92vh;">
        <mat-drawer #drawer mode="side" disableClose="true" opened="true">
          <mat-nav-list class="w-100">
            <mat-list-item class="w-100 d-flex">
              <div class="w-100 d-flex">
                <mat-icon class="col-1" mat-list-icon>person</mat-icon>
                <h4 class="col">Person</h4>
              </div>

            </mat-list-item>
            <mat-list-item class="w-100 d-flex">
              <div class="w-100 d-flex">
                <mat-icon class="col-1" mat-list-icon>assignment</mat-icon>
                <h4 class="col">Assignment</h4>
              </div>
            </mat-list-item>
            <mat-list-item class="w-100 d-flex">
              <div class="w-100 d-flex">
                <mat-icon class="col-1" mat-list-icon>domain</mat-icon>
                <h4 class="col">Domain</h4>
              </div>
            </mat-list-item>
            <mat-list-item class="w-100 d-flex">
              <div class="w-100 d-flex">
                <mat-icon class="col-1" mat-list-icon>folder_shared</mat-icon>
                <h4 class="col">Folder shared</h4>
              </div>
            </mat-list-item>
          </mat-nav-list>
        </mat-drawer>

        <div class="example-sidenav-content px-3">
          <router-outlet></router-outlet>
        </div>
      </mat-drawer-container>
      } @else {
      <router-outlet></router-outlet>
      }
    </div>
  </div>
</section>
